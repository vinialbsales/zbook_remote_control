CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_INPUT=y
CONFIG_LOG_PRINTK=n
# A busca do decodificador e recursiva (ate 33 niveis) e guarda as
# hipoteses de cada bloco na pilha: ~4 KB no pior caso.
CONFIG_MAIN_STACK_SIZE=8192

# Display OLED (SSD1306 por I2C) com o framebuffer de caracteres (CFB).
# A CFB aloca o buffer da tela (128 * 64 / 8 = 1 KB) com k_malloc.
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
