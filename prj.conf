CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_INPUT=y
CONFIG_LOG_PRINTK=n
# A busca do decodificador e recursiva (ate 33 niveis) e guarda as
# hipoteses de cada bloco na pilha: ~4 KB no pior caso.
CONFIG_MAIN_STACK_SIZE=8192

# Display OLED (SSD1306 por I2C) com o framebuffer de caracteres (CFB).
# A CFB aloca o buffer da tela (128 * 64 / 8 = 1 KB) com k_malloc.
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Slots na flash: subsistema settings com NVS na particao storage
# (zephyr,settings-partition da placa, ultimos 256 KB).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# Gravacoes cruas tem ate ~2 KB: 32 setores de 4 KB (128 KB dos 256 KB da
# particao). O NVS precisa de um setor livre para a coleta de lixo.
CONFIG_SETTINGS_NVS_SECTOR_COUNT=32

# Imprime toda captura IR (ver Kconfig). Para ligar sem mexer aqui:
#   west build -b zbook/rp2350b/m33 . -- -DCONFIG_APP_IR_DEBUG=y
CONFIG_APP_IR_DEBUG=n

# Caminho robusto do decodificador como reserva (ver Kconfig). Para
# comparar so com o convencional:
#   west build -b zbook/rp2350b/m33 . -- -DCONFIG_APP_IR_ROBUST_FALLBACK=n
CONFIG_APP_IR_ROBUST_FALLBACK=y
